{% extends 'base/base.html' %}

{% block title %}Login - PUMO Technovation Exam Portal{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-pumo border-0 shadow-lg">
                <div class="card-body p-4 p-md-5">
                    <!-- Branding Header -->
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 70px; height: 70px;">
                            <i class="bi bi-shield-lock-fill fs-2"></i>
                        </div>
                        <h3 class="fw-bold text-primary mb-1">PUMO TECHNOVATION</h3>
                        <h6 class="text-uppercase tracking-wider text-secondary fw-semibold mb-1" style="color: #0f4c81 !important; letter-spacing: 2px;">
                            EXAM PORTAL
                        </h6>
                        <span class="badge bg-primary bg-opacity-10 text-primary px-3 py-1 rounded-pill">POONAMALLEE</span>
                    </div>

                    <!-- Login Form -->
                    <form method="POST" action="{% url 'login' %}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold text-secondary small text-uppercase">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control border-start-0" id="username" name="username" placeholder="Enter your username" required autofocus>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold text-secondary small text-uppercase">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-key"></i></span>
                                <input type="password" class="form-control border-start-0 border-end-0" id="password" name="password" placeholder="Enter your password" required>
                                <button class="btn btn-outline-secondary border-start-0" type="button" id="togglePassword">
                                    <i class="bi bi-eye" id="toggleIcon"></i>
                                </button>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="remember_me" name="remember_me">
                                <label class="form-check-label small" for="remember_me">Remember me</label>
                            </div>
                            <span class="text-muted small">Poonamallee Branch</span>
                        </div>

                        <button type="submit" class="btn btn-pumo w-100 py-2 fs-6 shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In to Portal
                        </button>
                    </form>

                    <!-- Quick Demo Credentials Helpers -->
                    <div class="mt-4 pt-3 border-top text-center">
                        <small class="text-muted d-block mb-2 fw-semibold">Quick Demo Logins (Click to autofill):</small>
                        <div class="d-flex flex-wrap gap-2 justify-content-center">
                            <button type="button" class="btn btn-sm btn-outline-primary" onclick="autofill('admin', 'Sarathy@123')">
                                <i class="bi bi-shield-fill me-1"></i>Super Admin
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-info" onclick="autofill('trainer', 'Trainer@123')">
                                <i class="bi bi-person-badge-fill me-1"></i>Trainer
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-success" onclick="autofill('student', 'Student@123')">
                                <i class="bi bi-mortarboard-fill me-1"></i>Student
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Show/Hide password toggle
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggleIcon');

    togglePassword.addEventListener('click', function() {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        toggleIcon.classList.toggle('bi-eye');
        toggleIcon.classList.toggle('bi-eye-slash');
    });

    // Helper for fast demo login
    function autofill(u, p) {
        document.getElementById('username').value = u;
        document.getElementById('password').value = p;
    }
</script>
{% endblock %}
